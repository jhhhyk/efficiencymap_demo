<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>지도_DEMO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <div id="sidebar">
      <div id="sidebar-content" style="height: 100%; display: flex; flex-direction: column;"></div>
    </div>

    <div id="floating-controls">
      <div id="legend">
        <div class="lg-title" id="legend-title">소요시간 (분)</div>
        <div id="legend-rows"></div>
      </div>
      <div id="mode-toggle">
        <button id="btn-time" class="seg-btn active"><span class="dot"></span>시간</button>
        <button id="btn-eff" class="seg-btn"><span class="dot"></span>효율</button>
      </div>
    </div>

    <div id="filter-control">
      <div id="filter-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
        <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
        <line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line>
        <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </div>
      <div id="filter-slider-box">
        <span id="filter-val-label">전체</span>
        <input type="range" id="time-slider" min="5" max="60" step="5" value="60">
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/route.js"></script>
  <script src="js/ui.js"></script>
  <script>initMap();</script>
</body>
</html>
